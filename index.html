<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Product PRD Hub - 安全与产品原型中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f4c81;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 32px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        p.subtitle {
            color: #64748b;
            font-size: 1.05rem;
            margin-top: 8px;
        }
        .prd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .prd-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .prd-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .prd-card h3 {
            margin: 0 0 12px 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-enter {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            transition: background 0.2s;
        }
        .btn-enter:hover {
            background-color: #0b3860;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-folder-tree"></i> 企业级产品 PRD 原型中心</h1>
            <p class="subtitle">目录隔离的模块化 PRD 托管与管理门户 (Multi-PRD Repository Hub)</p>
        </header>

        <div class="prd-grid">
            <!-- PRD 1: SecureGuard -->
            <div class="prd-card">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="badge">v1.0 Final</span>
                        <span style="font-size: 0.8rem; color: #64748b;"><i class="fas fa-folder"></i> SecureGuard-PRD/</span>
                    </div>
                    <h3><i class="fas fa-shield-halved"></i> SecureGuard Compliance Suite</h3>
                    <p style="font-size: 0.9rem; color: #475569; line-height: 1.5;">统一 CVE 漏洞管理与 GDPR 合规平台。包含双模扫描、智能隐私风险暴露值 (PRE) 计算、无补丁虚拟防护及可视化仪表盘原型。</p>
                </div>
                <a href="SecureGuard-PRD/index.html" class="btn-enter">进入 PRD 页面 <i class="fas fa-arrow-right"></i></a>
            </div>

            <!-- Future PRD Placeholder -->
            <div class="prd-card" style="opacity: 0.6; border-style: dashed;">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="badge" style="background: #f1f5f9; color: #64748b;">规划中</span>
                        <span style="font-size: 0.8rem; color: #94a3b8;"><i class="fas fa-folder"></i> [Future-PRD]/</span>
                    </div>
                    <h3 style="color: #64748b;"><i class="fas fa-plus-circle"></i> 未来新产品 PRD 目录</h3>
                    <p style="font-size: 0.9rem; color: #64748b; line-height: 1.5;">独立的文件夹隔离设计，只需在根目录下创建新文件夹即可轻松支持多产品 PRD 扩展。</p>
                </div>
                <span style="display:block; text-align:center; padding:10px; font-size:0.85rem; color:#94a3b8;">隔离托管中</span>
            </div>
        </div>
    </div>
</body>
</html>
